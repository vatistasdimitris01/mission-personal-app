<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#58cc02">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mission">
<title>Mission — Daily goals made fun</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%2358cc02' d='M13.5 2 5 13h6l-1 9 9-12h-6l.5-8Z'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito+Sans:wght@600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root{--green:#58cc02;--green-dark:#46a302;--blue:#1cb0f6;--blue-dark:#168fc8;--yellow:#ffc800;--orange:#ff9600;--red:#ff4b4b;--page:#0b0d0f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;scrollbar-width:none}::-webkit-scrollbar{display:none}
html,body{margin:0;min-height:100vh;background:#0b0d0f;color:#f7f7f7;font-family:"Nunito Sans",sans-serif}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
.icon{width:24px;height:24px;display:block;fill:none;stroke:currentColor;stroke-width:2.25;stroke-linecap:round;stroke-linejoin:round}
.fill{fill:currentColor;stroke:none}
.shell{width:min(1180px,100%);margin:auto;display:grid;grid-template-columns:240px minmax(0,640px) 260px;gap:36px;min-height:100vh;padding:0 24px}
.sidebar{height:100vh;position:sticky;top:0;padding:34px 16px 28px 0;border-right:2px solid #2a2d32;display:flex;flex-direction:column;z-index:20}
.brand{display:flex;align-items:center;gap:12px;margin:0 8px 34px;color:var(--green)}
.brand-mark{width:43px;height:43px;border-radius:15px;background:var(--green);box-shadow:0 5px 0 var(--green-dark);display:grid;place-items:center;color:#fff;transform:rotate(-4deg)}
.brand-mark .icon{width:25px;height:25px;stroke-width:3}
.brand-name{font-family:"Fredoka",sans-serif;font-size:27px;font-weight:700}
.nav{display:flex;flex-direction:column;gap:8px}
.nav button{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:16px;border:none;background:transparent;color:#afafaf;font-weight:800;font-size:16px;text-align:left}
.nav button.active{background:#1a1d21;color:#fff}
.content{padding:28px 0 40px;min-width:0}
.mobile-head{display:none}
.page{display:none}.page.active{display:block}
.goal-card{position:relative;overflow:hidden;background:var(--green);border-radius:25px;padding:25px 26px 22px;color:#fff;box-shadow:0 7px 0 var(--green-dark);margin-bottom:34px}
.goal-card:after{content:"";position:absolute;width:190px;height:190px;border:34px solid #ffffff16;border-radius:50%;right:-72px;top:-82px}
.goal-grid{display:grid;grid-template-columns:1fr 125px;gap:18px;align-items:center;position:relative;z-index:1}
.goal-kicker{font-size:12px;text-transform:uppercase;letter-spacing:.12em;font-weight:900;opacity:.8}
.goal-card h1{font-family:"Fredoka";font-size:31px;line-height:1.08;margin:5px 0 8px}
.goal-card p{font-size:14px;margin:0;opacity:.9;font-weight:700}
.progress-orb{width:112px;height:112px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#fff var(--p),#ffffff45 0);position:relative;margin-left:auto}
.progress-orb:after{content:"";position:absolute;inset:9px;border-radius:50%;background:var(--green)}
.progress-orb b{position:relative;z-index:1;font-family:"Fredoka";font-size:25px}
.goal-bottom{position:relative;z-index:1;margin-top:22px;display:flex;align-items:center;gap:12px}
.goal-track{height:14px;flex:1;border-radius:20px;background:#ffffff45;overflow:hidden}
.goal-track i{display:block;height:100%;width:0;border-radius:20px;background:#fff;transition:.35s}
.goal-count{font-size:13px;font-weight:900}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:0 2px 15px}
.section-head h2{font-family:"Fredoka";font-size:23px;margin:0;color:#f7f7f7}
.section-head span{color:#7f838a;font-size:12px;font-weight:900;text-transform:uppercase}
.tasks{display:flex;flex-direction:column;gap:14px}
.task{--accent:var(--blue);--accent-dark:var(--blue-dark);display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:14px;align-items:center;padding:15px 16px 15px 14px;border:2px solid #2b2f35;border-bottom-width:5px;border-radius:20px;background:#15181c}
.task[data-color="green"]{--accent:var(--green);--accent-dark:var(--green-dark)}
.task[data-color="yellow"]{--accent:var(--yellow);--accent-dark:#d7a900}
.task[data-color="orange"]{--accent:var(--orange);--accent-dark:#d77e00}
.task[data-color="red"]{--accent:var(--red);--accent-dark:#d83c3c}
.task.done{opacity:.55}
.task.done .task-name{text-decoration:line-through;color:#7f838a}
.task-icon{width:56px;height:56px;border-radius:16px;background:var(--accent);box-shadow:0 4px 0 var(--accent-dark);display:grid;place-items:center;color:#fff}
.task-icon .icon{width:28px;height:28px;stroke-width:2.5}
.task-name{font-size:16px;font-weight:800;margin:0 0 4px}
.task-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.xp-pill{font-size:11px;font-weight:900;padding:3px 8px;border-radius:8px;background:var(--accent);color:#fff}
.task-desc{font-size:12px;color:#7f838a;font-weight:700}
.check{width:44px;height:44px;border-radius:14px;border:2.5px solid #3a3f46;background:#0f1215;display:grid;place-items:center;color:#7f838a}
.task.done .check{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 3px 0 var(--accent-dark)}
.form-card{background:#15181c;border:2px solid #2b2f35;border-radius:22px;padding:22px;margin-top:28px}
.form-card h3{font-family:"Fredoka";font-size:20px;margin:0 0 16px}
.form-row{margin-bottom:14px}
.form-row label{display:block;font-size:12px;font-weight:900;color:#7f838a;margin-bottom:6px;text-transform:uppercase}
.form-row input,.form-row select{width:100%;height:48px;border-radius:14px;border:2px solid #2b2f35;background:#0f1215;padding:0 14px;font-weight:700;color:#f7f7f7}
.icon-picker{display:flex;flex-wrap:wrap;gap:8px}
.icon-picker button{width:44px;height:44px;border-radius:12px;border:2px solid #2b2f35;background:#0f1215;display:grid;place-items:center;color:#afafaf}
.icon-picker button.active{border-color:var(--green);color:var(--green);background:#152016}
.btn-primary{width:100%;height:52px;border:none;border-radius:16px;background:var(--green);color:#fff;font-weight:900;font-size:16px;box-shadow:0 5px 0 var(--green-dark);margin-top:8px}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:24px}
.stat-card{background:#15181c;border:2px solid #2b2f35;border-radius:20px;padding:18px;text-align:center}
.stat-card b{display:block;font-family:"Fredoka";font-size:28px;margin-bottom:4px}
.stat-card span{font-size:12px;color:#7f838a;font-weight:800;text-transform:uppercase}
#app-loader{position:fixed;inset:0;background:#0b0d0f;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .35s}
#app-loader.hide{opacity:0;visibility:hidden;pointer-events:none}
#app-loader .loader-mark{width:56px;height:56px;border-radius:16px;background:#58cc02;box-shadow:0 6px 0 #46a302;display:grid;place-items:center;color:#fff;transform:rotate(-4deg);margin-bottom:16px}
#app-loader .loader-mark svg{width:30px;height:30px;fill:#fff}
#app-loader .loader-name{font-family:"Fredoka",sans-serif;font-size:22px;font-weight:700;color:#58cc02}
.duo-glass{background:rgba(16,20,24,.9);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:9999px;border:1px solid rgba(255,255,255,.05);box-shadow:0 10px 40px -10px rgba(0,0,0,.7)}
#mobileNavbar{display:none;position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:9999;width:min(287px,calc(100vw - 104px));height:62px;padding:4px;box-sizing:border-box}
#mobileNavbar button{min-height:54px!important;height:100%;padding-top:6px!important;padding-bottom:6px!important}
#mobileNavbar .tab-wrapper .w-4{width:22px!important;height:22px!important}
#mobileNavbar .tab-wrapper span{font-size:9px!important}
.panel-title{margin-bottom:16px}.panel-title h1{font-family:"Fredoka";font-size:26px;margin:0;color:#f7f7f7}.panel-title p{color:#7f838a;font-size:13px;font-weight:700;margin:4px 0 0}
.stat-card.primary{background:linear-gradient(145deg,#2a2210,#1a1810);border-color:#5a4a20;text-align:left;padding:16px}
.stat-icon{width:36px;height:36px;border-radius:11px;background:#1a1d21;color:var(--orange);display:grid;place-items:center;margin-bottom:8px}.stat-icon .icon{width:20px;height:20px}
.stat-stack{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rank-card{border-radius:18px;background:linear-gradient(135deg,#1cb0f6,#0e7aa8);box-shadow:0 5px 0 #0a5f84;color:#fff;padding:16px;margin-bottom:20px}
.rank-row{display:flex;justify-content:space-between;align-items:center}.rank-row small{font-size:10px;font-weight:900;text-transform:uppercase;opacity:.85}.rank-row h3{font-family:"Fredoka";font-size:22px;margin:2px 0 0}
.rank-track{height:10px;border-radius:20px;background:rgba(255,255,255,.25);margin-top:12px;overflow:hidden}.rank-track i{display:block;height:100%;width:0;background:#fff;border-radius:20px;transition:.35s}
.calendar-card{border:2px solid #2b2f35;border-bottom-width:5px;border-radius:18px;background:#15181c;padding:14px;margin-bottom:18px}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.day{text-align:center;font-size:9px;font-weight:900;color:#7f838a;text-transform:uppercase}
.dot{aspect-ratio:1;border-radius:9px;background:#1a1d21;margin-top:4px;display:grid;place-items:center;color:#555;font-size:10px;font-weight:800;border:2px solid transparent}
.dot.done{background:#1a2e12;border-color:#3d6b22;color:var(--green)}.dot.today{outline:2px solid var(--blue);outline-offset:1px}
.coach-card{display:grid;grid-template-columns:56px 1fr;gap:12px;align-items:center;border:2px solid #2b3d22;border-bottom-width:5px;border-radius:18px;padding:14px;background:#152016;margin-bottom:16px}
.mascot{width:48px;height:48px;border-radius:14px;background:var(--green);box-shadow:0 3px 0 var(--green-dark);display:grid;place-items:center}
.mascot-eyes{display:flex;gap:8px}.mascot-eyes i{width:7px;height:7px;border-radius:50%;background:#0b0d0f}
.coach-card strong{font-family:"Fredoka";font-size:15px;color:#f7f7f7;display:block}.coach-card p{color:#7f838a;font-size:12px;font-weight:700;margin:3px 0 0}
.mission-list{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.mission-row{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border:2px solid #2b2f35;border-radius:14px;background:#15181c}
.mission-row .mr-icon{width:36px;height:36px;border-radius:10px;background:var(--blue);display:grid;place-items:center;color:#fff}.mission-row .mr-icon .icon{width:18px;height:18px}
.mission-row strong{font-size:14px;font-weight:800;display:block}.mission-row span{font-size:11px;color:#7f838a;font-weight:700}
.mission-row .del{width:32px;height:32px;border-radius:9px;border:2px solid #3a2a2a;background:#1a1212;color:#ff6b6b;font-weight:900;font-size:16px}
.data-card{border:2px solid #2b2f35;border-radius:16px;padding:14px;background:#15181c;margin-bottom:12px}
.data-card strong{font-family:"Fredoka";font-size:15px;color:#f7f7f7}.data-card p{color:#7f838a;font-size:12px;margin:4px 0 10px;font-weight:700}
.btn-danger{height:42px;border:none;border-radius:11px;background:#ff4b4b;color:#fff;font-weight:900;box-shadow:0 3px 0 #d83c3c;padding:0 14px}
.btn-secondary{height:42px;border:2px solid #2b2f35;border-radius:11px;background:#1a1d21;color:#f7f7f7;font-weight:800;padding:0 14px;width:100%}
.customize-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.customize-row label{display:block;font-size:10px;font-weight:900;color:#7f838a;text-transform:uppercase;margin-bottom:4px}
.customize-row select{width:100%;height:42px;border-radius:11px;border:2px solid #2b2f35;background:#0f1215;padding:0 10px;font-weight:700;color:#f7f7f7}
@media(max-width:760px){
.shell{display:block;padding:0;min-height:100vh}.sidebar{display:none!important}
#mobileNavbar{display:flex!important}
.content{padding:0 16px calc(100px + env(safe-area-inset-bottom,0px));max-width:640px;margin:auto}
.mobile-head{min-height:65px;display:flex;align-items:center;justify-content:space-between;margin:0 -16px 18px;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;background:#0b0d0f;position:sticky;top:0;z-index:30}
.mobile-brand{font-family:"Fredoka";font-size:22px;color:var(--green);display:flex;align-items:center;gap:8px}
.mobile-brand .brand-mark{width:31px;height:31px;border-radius:10px;box-shadow:0 3px 0 var(--green-dark)}.mobile-brand .icon{width:18px;height:18px}
.mobile-stats{display:flex;gap:11px}.mobile-stat{display:flex;align-items:center;gap:4px;font-weight:900;font-size:13px}.mobile-stat .icon{width:18px;height:18px}.mobile-stat.fire{color:var(--orange)}.mobile-stat.xp{color:var(--blue)}
.goal-card{padding:22px 20px 19px;border-radius:22px}.goal-grid{grid-template-columns:1fr 92px}.goal-card h1{font-size:26px}.progress-orb{width:86px;height:86px}.progress-orb b{font-size:21px}
.task{grid-template-columns:53px minmax(0,1fr) auto;padding:12px;gap:11px}.task-icon{width:50px;height:50px;border-radius:15px}.task-icon .icon{width:25px;height:25px}.task-name{font-size:15px}.check{width:40px;height:40px}
.stats-grid{grid-template-columns:1fr}.stats-grid.rich{grid-template-columns:1fr!important}.panel-title h1{font-size:22px}
}
</style>
</head>
<body>
<div id="app-loader"><div class="loader-mark"><svg viewBox="0 0 24 24"><path d="M13.5 2 5 13h6l-1 9 9-12h-6l.5-8Z"/></svg></div><div class="loader-name">mission</div></div>
<p style="color:#fff;padding:40px;text-align:center">Restoring full app… refresh in a moment.</p>
</body>
</html>
